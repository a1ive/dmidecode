name: MSBuild

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  # Define the artifact name for consistency
  ARTIFACT_NAME: dmidecode

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        msbuild /m /p:Configuration=Release /p:platform=x64 ${{env.SOLUTION_FILE_PATH}}
        msbuild /m /p:Configuration=Release /p:platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Stage artifacts for packaging
      run: |
        New-Item -Path "build/x64", "build/x86" -ItemType Directory -Force
        Move-Item -Path "x64/Release/dmidecode.exe" -Destination "build/x64/dmidecode.exe"
        Move-Item -Path "Win32/Release/dmidecode.exe" -Destination "build/x86/dmidecode.exe"
        Copy-Item -Path "LICENSE" -Destination "build/LICENSE"

    - name: Create ZIP Archive
      run: Compress-Archive -Path build/* -DestinationPath "${{ env.ARTIFACT_NAME }}.zip"

    - name: Delete old release
      continue-on-error: true
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        gh release delete latest --cleanup-tag --yes
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    - name: Create new release
      run: |
        gh release create latest "build/${{ env.ARTIFACT_NAME }}.zip" `
          --latest `
          --title "Development Build" `
          --notes "Automated build from commit ${{ github.sha }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
